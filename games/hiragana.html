<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ひらがな なぞり</title>
    <link rel="stylesheet" href="./game-common.css" />
    <link rel="stylesheet" href="./hiragana.css" />
  </head>
  <body>
    <div class="game-shell">
      <div class="app">
        <section id="titleScreen" class="screen show">
          <div class="title-box">
            <div class="badge">3つの文字</div>
            <h1>ひらがなを なぞろう！</h1>
            <p class="lead">に・い・な を みて、ゆびで なぞってみよう！</p>
            <button id="startBtn" class="primary-btn" type="button">はじめる</button>
          </div>
        </section>

        <section id="practiceScreen" class="screen">
          <div class="practice-box">
            <div class="header">
              <div id="progressText" class="badge">1 / 3</div>
              <button id="retryBtn" class="secondary-btn" type="button">やりなおす</button>
            </div>

            <div id="wordLabel" class="word-label">に</div>

            <div class="canvas-wrap">
              <canvas id="hiraganaCanvas" width="360" height="360"></canvas>
            </div>

            <div id="statusText" class="status-text">ゆびで なぞってみよう！</div>
          </div>
        </section>

        <section id="clearScreen" class="screen">
          <div class="clear-box">
            <div class="celebrate">ぜんぶ できたね！</div>
            <button id="restartBtn" class="primary-btn" type="button">もういちど</button>
          </div>
        </section>
      </div>
    </div>

    <script src="./game-common.js"></script>
    <script src="./hiragana.js"></script>
  </body>
</html>
