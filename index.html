<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ChildGames - ゲームを選ぶ</title>
    <style>
      :root {
        --bg: #fff7d6;
        --accent: #ff8fab;
        --muted: #6b6b6b;
        --text: #5a3d2b;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(180deg, #9fe3ff 0%, var(--bg) 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        color: var(--text);
      }

      .wrap {
        width: min(980px, 100%);
        max-width: 980px;
      }

      header {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      h1 {
        margin: 0;
        font-size: clamp(20px, 4vw, 28px);
      }

      .lead {
        margin: 8px 0 18px;
        color: var(--muted);
        line-height: 1.6;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
      }

      .card {
        background: #fff;
        border-radius: 14px;
        padding: 18px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        text-align: center;
      }

      .card h3 {
        margin: 0 0 8px;
        font-size: 1.1rem;
      }

      .card p {
        margin: 0 0 12px;
        color: #666;
        line-height: 1.5;
      }

      .btn {
        display: inline-block;
        padding: 10px 14px;
        border-radius: 999px;
        background: linear-gradient(135deg, var(--accent), #ff5d7a);
        color: #fff;
        text-decoration: none;
        font-weight: 700;
      }

      .disabled {
        opacity: 0.6;
        cursor: default;
      }

      footer {
        margin-top: 18px;
        text-align: center;
        color: #444;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>ChildGames</h1>
      </header>
      <p class="lead">遊びたいゲームを選んでね。今は風船ゲームが遊べます。</p>

      <div class="grid">
        <div class="card">
          <h3>風船ゲーム (Balloon)</h3>
          <p>風船をタップして割る楽しいミニゲーム。レベルアップやゲームオーバーあり。</p>
          <a class="btn" href="games/balloon.html">遊ぶ</a>
        </div>

        <div class="card">
          <h3>おかいものゲーム</h3>
          <p>数字・ひらがな・食べ物を楽しく覚えられるお買い物ゲームです。</p>
          <a class="btn" href="games/shopping.html">遊ぶ</a>
        </div>

        <div class="card">
          <h3>ひらがな なぞり</h3>
          <p>「に」「い」「な」をなぞって、ひらがなに慣れる最小プロトタイプです。</p>
          <a class="btn" href="games/hiragana.html">遊ぶ</a>
        </div>
      </div>

      <footer>v1.0 • 追加のゲームは順次公開予定</footer>
    </div>
  </body>
</html>
