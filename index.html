<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ChildGames - ゲームを選ぶ</title>
    <style>
      :root {
        --paper: rgba(255, 255, 255, 0.94);
        --text: #3f2a1f;
        --sub: #6a4f41;
        --green: #59bf4a;
        --blue: #4f9df7;
        --pink: #ff6f8f;
        --orange: #ffb13b;
        --shadow: rgba(120, 72, 37, 0.16);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        font-family: "Hiragino Kaku Gothic Pro", "Yu Gothic", "Arial", sans-serif;
        background: radial-gradient(circle at 25% 15%, #ffffff 0%, #fff7d9 48%, #ffeec8 100%);
        color: var(--text);
        overflow: hidden auto;
      }

      .page-shell {
        position: relative;
        width: min(1160px, calc(100% - 24px));
        margin: 10px auto 24px;
        padding: 18px 18px 20px;
        border-radius: 38px;
        background: var(--paper);
        box-shadow: 0 18px 34px var(--shadow), inset 0 0 0 2px rgba(255, 255, 255, 0.95);
      }

      .float-shape {
        position: absolute;
        font-size: clamp(1.2rem, 3vw, 2rem);
        opacity: 0.8;
        pointer-events: none;
      }

      .shape-a { left: 28px; top: 30px; color: #f7a1bc; }
      .shape-b { right: 34px; top: 34px; color: #88d7ff; }
      .shape-c { left: 40px; bottom: 30px; color: #ffc851; }
      .shape-d { right: 42px; bottom: 26px; color: #7ecf79; }

      .princess-wrap {
        position: absolute;
        left: 50%;
        top: 18px;
        transform: translateX(-50%);
        width: 150px;
        height: 150px;
        z-index: 2;
      }

      .princess-button {
        width: 100%;
        height: 100%;
        border: none;
        background: transparent;
        padding: 0;
        cursor: pointer;
        display: block;
        border-radius: 50%;
        box-shadow: 0 12px 18px rgba(126, 82, 98, 0.12);
      }

      .princess-button img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        pointer-events: none;
      }

      .princess-button:active {
        transform: scale(0.97);
      }

      .hero {
        text-align: center;
        padding: 110px 0 4px;
      }

      .title {
        margin: 16px 0 8px;
        font-size: clamp(2.1rem, 7.6vw, 5rem);
        line-height: 1.1;
        letter-spacing: 0.03em;
        font-weight: 900;
      }

      .title .green { color: var(--green); }
      .title .blue { color: var(--blue); }
      .title .pink { color: var(--pink); }

      .lead {
        margin: 0;
        font-size: clamp(1.1rem, 3vw, 2rem);
        font-weight: 800;
        color: var(--sub);
      }

      .game-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
        margin-top: 20px;
      }

      .card {
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 220px;
        padding: 16px 14px 14px;
        border: 3px solid rgba(255, 255, 255, 0.95);
        border-radius: 28px;
        box-shadow: 0 10px 18px var(--shadow);
        text-align: center;
        text-decoration: none;
        color: var(--text);
        transform: translateY(0);
        transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
        touch-action: manipulation;
        user-select: none;
      }

      .card:active {
        transform: translateY(2px) scale(0.985);
      }

      .card--balloon {
        background: linear-gradient(180deg, #fff6b4, #ffe5c7);
      }

      .card--shopping {
        background: linear-gradient(180deg, #d9ffd0, #dcf8ff);
      }

      .card--hiragana {
        background: linear-gradient(180deg, #ffe4f1, #ffeec6);
      }

      .card--number {
        background: linear-gradient(180deg, #dbecff, #e6f7ff);
      }

      .card--difference {
        background: linear-gradient(180deg, #fce1ff, #def6ff);
      }

      .card--color {
        background: linear-gradient(180deg, #ffe8d9, #f0e7ff);
      }

      .card--puzzle {
        background: linear-gradient(180deg, #e2ffe9, #fff3be);
      }

      .card--future {
        opacity: 0.92;
        border-style: dashed;
      }

      .card-art {
        display: block;
        font-size: clamp(2.6rem, 7vw, 4rem);
        line-height: 1;
        margin-bottom: 8px;
      }

      .card-title {
        display: block;
        font-size: clamp(1.25rem, 3.2vw, 2rem);
        font-weight: 900;
        line-height: 1.2;
      }

      .card-sub {
        display: block;
        margin-top: 6px;
        font-size: clamp(0.78rem, 2vw, 0.98rem);
        font-weight: 700;
        color: var(--sub);
      }

      @media (max-width: 640px) {
        body {
          overflow-x: hidden;
        }

        .page-shell {
          width: calc(100% - 8px);
          margin: 0 auto;
          border-radius: 20px;
          min-height: auto;
          padding: 8px 8px 10px;
        }

        .princess-wrap {
          width: 96px;
          height: 96px;
          left: 50%;
          top: 6px;
        }

        .hero {
          padding: 84px 0 2px;
        }

        .title {
          margin: 8px 0 4px;
          font-size: clamp(1.7rem, 7vw, 2.7rem);
        }

        .lead {
          font-size: 0.94rem;
        }

        .game-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 8px;
          margin-top: 10px;
        }

        .card {
          min-height: 118px;
          border-radius: 18px;
          padding: 8px 6px;
          border-width: 3px;
        }

        .card-art {
          font-size: 1.9rem;
          margin-bottom: 4px;
        }

        .card-title {
          font-size: 0.98rem;
        }

        .card-sub {
          margin-top: 3px;
          font-size: 0.7rem;
        }

        .float-shape {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="page-shell">
      <span class="float-shape shape-a" aria-hidden="true">♪</span>
      <span class="float-shape shape-b" aria-hidden="true">★</span>
      <span class="float-shape shape-c" aria-hidden="true">●</span>
      <span class="float-shape shape-d" aria-hidden="true">◆</span>

      <div class="princess-wrap">
        <button id="princessBtn" class="princess-button" type="button" aria-label="音声を再生">
          <img src="./images/princess1.png" alt="プリンセス" />
        </button>
      </div>

      <header class="hero">
        <h1 class="title"><span class="pink">げ</span><span class="blue">ー</span><span class="green">む</span>を えらんでね！</h1>
        <p class="lead">どのゲームに チャレンジする？</p>
      </header>

      <main class="game-grid" aria-label="ゲーム一覧">
        <a class="card card--balloon" href="games/balloon.html" aria-label="風船ゲーム">
          <span class="card-art" aria-hidden="true">🎈</span>
          <span class="card-title">ふうせん</span>
          <span class="card-sub">ぽんぽん</span>
        </a>

        <a class="card card--shopping" href="games/shopping.html" aria-label="おかいもの">
          <span class="card-art" aria-hidden="true">🛒</span>
          <span class="card-title">おかいもの</span>
          <span class="card-sub">りんごとおもちゃ</span>
        </a>

        <a class="card card--hiragana" href="games/hiragana.html" aria-label="ひらがな">
          <span class="card-art" aria-hidden="true">✏️</span>
          <span class="card-title">ひらがな</span>
          <span class="card-sub">あ を なぞる</span>
        </a>

        <a class="card card--number" href="games/numbers.html" aria-label="すうじをならべよう">
          <span class="card-art" aria-hidden="true">🔢</span>
          <span class="card-title">すうじを ならべよう</span>
          <span class="card-sub">1 2 3</span>
        </a>

        <a class="card card--difference" href="games/difference.html" aria-label="まちがいさがし">
          <span class="card-art" aria-hidden="true">🔍</span>
          <span class="card-title">まちがいさがし</span>
          <span class="card-sub">くらべて みつけよう</span>
        </a>

        <div class="card card--color card--future" aria-label="いろとかたちゲーム">
          <span class="card-art" aria-hidden="true">○ △ □</span>
          <span class="card-title">いろ・かたち</span>
          <span class="card-sub">あお きれい</span>
        </div>

        <div class="card card--puzzle card--future" aria-label="パズルゲーム">
          <span class="card-art" aria-hidden="true">🧩</span>
          <span class="card-title">パズル</span>
          <span class="card-sub">ぴったり</span>
        </div>
      </main>

    </div>

    <script>
      (() => {
        const topAudio = new Audio('games/sounds/Top.mp3');
        topAudio.preload = 'auto';

        const playTopAudio = () => {
          topAudio.currentTime = 0;
          topAudio.play().catch(() => {});
        };

        const princessBtn = document.getElementById('princessBtn');
        if (princessBtn) {
          princessBtn.addEventListener('click', playTopAudio);
        }
      })();
    </script>
  </body>
</html>
