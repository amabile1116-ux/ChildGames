<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ふわふわ風船ゲーム</title>
    <style>
      :root {
        --bg: #fff7d6;
        --sky: #9fe3ff;
        --balloon: #ff6b6b;
        --balloon-shadow: #ff4d4d;
        --text: #5a3d2b;
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        margin: 0;
        font-family: "Yomogi", "Comic Sans MS", "Trebuchet MS", sans-serif;
        background: linear-gradient(180deg, var(--sky) 0%, var(--bg) 100%);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 16px;
        touch-action: manipulation;
        user-select: none;
      }

      .game {
        width: min(100%, 460px);
        height: min(92vh, 760px);
        background: rgba(255, 255, 255, 0.75);
        border: 4px solid #fff;
        border-radius: 24px;
        box-shadow: 0 12px 24px rgba(0, 0, 0, 0.16);
        padding: 16px;
        display: flex;
        flex-direction: column;
        position: relative;
        overflow: hidden;
      }

      .header {
        text-align: center;
      }

      .header h1 {
        margin: 6px 0 4px;
        font-size: clamp(24px, 5vw, 32px);
      }

      .header p {
        margin: 0;
        font-size: clamp(14px, 3.5vw, 18px);
      }

      .hud {
        display: flex;
        justify-content: center;
        gap: 8px;
        flex-wrap: wrap;
        margin: 10px 0 8px;
      }

      .badge {
        font-size: clamp(16px, 3.8vw, 22px);
        font-weight: 700;
        background: #fff;
        border-radius: 999px;
        padding: 8px 12px;
        display: inline-block;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
      }

      .stage {
        flex: 1;
        position: relative;
        border-radius: 20px;
        overflow: hidden;
        background: linear-gradient(180deg, #b7f0ff 0%, #fef5cd 100%);
        margin-top: 8px;
        border: 2px solid #fff;
      }

      .cloud {
        position: absolute;
        top: 12px;
        width: 70px;
        height: 28px;
        background: white;
        border-radius: 999px;
        opacity: 0.8;
      }

      .cloud::before,
      .cloud::after {
        content: "";
        position: absolute;
        background: white;
        border-radius: 50%;
      }

      .cloud::before {
        width: 24px;
        height: 24px;
        left: 10px;
        top: -10px;
      }

      .cloud::after {
        width: 30px;
        height: 30px;
        right: 10px;
        top: -12px;
      }

      .cloud.left {
        left: 18px;
      }

      .cloud.right {
        right: 18px;
        top: 54px;
      }

      .balloon {
        position: absolute;
        width: clamp(56px, 14vw, 90px);
        height: clamp(72px, 18vw, 112px);
        border: none;
        background: transparent;
        padding: 0;
        cursor: pointer;
        transition: transform 0.15s ease;
        animation: bob 1.8s ease-in-out infinite;
        will-change: transform;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
      }

      .balloon span {
        pointer-events: none;
      }

      .balloon:active {
        transform: scale(0.94);
      }

      .balloon .body {
        position: absolute;
        inset: 0;
        background: var(--balloon);
        border-radius: 50% 50% 45% 45%;
        box-shadow: inset -8px -8px 0 rgba(255, 255, 255, 0.25), 0 8px 0 var(--balloon-shadow);
        transform: rotate(-6deg);
      }

      .balloon .tail {
        position: absolute;
        left: 50%;
        bottom: -8px;
        width: 4px;
        height: 26px;
        background: #d45b5b;
        transform: translateX(-50%);
      }

      .balloon .knot {
        position: absolute;
        left: 50%;
        bottom: -16px;
        width: 12px;
        height: 12px;
        background: #d45b5b;
        border-radius: 50%;
        transform: translateX(-50%);
      }

      .balloon.popped {
        animation: none;
        pointer-events: none;
      }

      .balloon.popped .body {
        background: #ffd4d4;
        box-shadow: inset 0 0 0 rgba(255, 255, 255, 0.25);
        transform: scale(0.8) rotate(12deg);
      }

      .balloon.popped .tail,
      .balloon.popped .knot {
        opacity: 0;
      }

      .stars {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 3;
      }

      .star {
        position: absolute;
        width: 10px;
        height: 10px;
        background: #ffd54f;
        clip-path: polygon(50% 0%, 61% 35%, 100% 50%, 61% 65%, 50% 100%, 39% 65%, 0% 50%, 39% 35%);
        animation: burst 0.7s ease-out forwards;
        opacity: 0;
        box-shadow: 0 0 10px #ffd54f;
      }

      .level-notice {
        position: absolute;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        padding: 8px 14px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.95);
        border: 3px solid #ff9f1c;
        color: #5a3d2b;
        font-weight: 700;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease;
        z-index: 4;
      }

      .level-notice.show {
        opacity: 1;
      }

      .ghost-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        display: flex;
        justify-content: center;
        align-items: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease;
        z-index: 5;
      }

      .ghost-overlay.show {
        opacity: 1;
      }

      .ghost-icon {
        font-size: clamp(80px, 18vw, 160px);
        filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.85));
      }

      .gameover-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.7);
        display: flex;
        justify-content: center;
        align-items: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease;
        z-index: 6;
      }

      .gameover-overlay.show {
        opacity: 1;
        pointer-events: all;
      }

      .gameover-box {
        background: #fff;
        border-radius: 24px;
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.18);
        padding: 24px 28px;
        text-align: center;
        max-width: 280px;
        animation: popIn 0.35s ease-out;
      }

      .gameover-box h2 {
        margin: 0 0 10px;
        font-size: clamp(24px, 5vw, 30px);
      }

      .gameover-box p {
        margin: 0 0 18px;
        font-size: clamp(16px, 3.5vw, 18px);
      }

      .gameover-overlay.show .gameover-box {
        animation: pulseGlow 1s ease-in-out infinite alternate;
      }

      @keyframes popIn {
        from { transform: scale(0.8); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
      }

      @keyframes pulseGlow {
        from { box-shadow: 0 10px 24px rgba(0, 0, 0, 0.18); }
        to { box-shadow: 0 14px 34px rgba(255, 120, 120, 0.35); }
      }

      .gameover-box h2 {
        margin: 0 0 10px;
        font-size: clamp(24px, 5vw, 30px);
      }

      .gameover-box p {
        margin: 0 0 18px;
        font-size: clamp(16px, 3.5vw, 18px);
      }

      .balloon {
        z-index: 2;
      }

      @keyframes bob {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }

      @keyframes burst {
        0% { opacity: 1; transform: scale(0.4) translate(0, 0); }
        100% { opacity: 0; transform: scale(1.2) translate(var(--x), var(--y)); }
      }

      @media (max-width: 480px) {
        .game {
          height: 100vh;
          border-radius: 0;
          border-width: 0;
          padding: 12px;
        }

        .stage {
          border-radius: 16px;
        }
      }
    </style>
  </head>
  <body>
    <div class="game">
      <div class="header">
        <h1>風船をたっぷり割ろう！</h1>
        <p>風船をタップして、10こ割るごとにレベルアップ！</p>
        <div class="hud">
          <div class="badge" id="counter">0/10</div>
          <div class="badge" id="level">レベル 1</div>
        </div>
      </div>

      <div class="stage" id="stage">
        <div class="cloud left"></div>
        <div class="cloud right"></div>
        <div class="stars" id="stars"></div>
        <div class="ghost-overlay" id="ghostOverlay">
          <div class="ghost-icon">👻</div>
        </div>
        <div class="gameover-overlay" id="gameoverOverlay">
          <div class="gameover-box">
            <h2>残念！</h2>
            <p>またチャレンジしてね★</p>
            <button class="retry" id="retry">最初から</button>
          </div>
        </div>
        <div class="level-notice" id="levelNotice">レベルアップ！</div>
      </div>
    </div>

    <script>
      const stage = document.getElementById("stage");
      const starsBox = document.getElementById("stars");
      const counter = document.getElementById("counter");
      const levelDisplay = document.getElementById("level");
      const levelNotice = document.getElementById("levelNotice");
      const ghostOverlay = document.getElementById("ghostOverlay");
      const gameoverOverlay = document.getElementById("gameoverOverlay");
      const retryButton = document.getElementById("retry");

      const popGoal = 10;
      let poppedCount = 0;
      let ghostPops = 0;
      let level = 1;
      let balloons = [];
      let animationFrameId = null;
      let lastTime = 0;
      let gameOver = false;
      let audioContext = null;
      const balloonColors = [
        { body: "#ff6b6b", shadow: "#ff4d4d", tail: "#d45b5b" },
        { body: "#6ec1ff", shadow: "#4a9fe7", tail: "#397acc" },
        { body: "#ffd16a", shadow: "#f4b749", tail: "#d8972d" },
        { body: "#8d6cff", shadow: "#744be6", tail: "#5d38b4" },
        { body: "#6cd6b3", shadow: "#44b48f", tail: "#2a8b74" },
        { body: "#ff91d3", shadow: "#f56fb6", tail: "#d34b8d" },
        { body: "#333333", shadow: "#000000", tail: "#333333", ghost: true },
      ];

      function showLevelNotice(text) {
        levelNotice.textContent = text;
        levelNotice.classList.add("show");
        clearTimeout(levelNotice.timeoutId);
        levelNotice.timeoutId = setTimeout(() => {
          levelNotice.classList.remove("show");
        }, 900);
      }

      function createBalloon() {
        const button = document.createElement("button");
        button.className = "balloon";
        button.type = "button";

        const size = 56 + Math.random() * 34;
        const stageWidth = Math.max(120, stage.clientWidth - 24);
        const x = 8 + Math.random() * Math.max(1, stageWidth - size - 16);
        const y = stage.clientHeight + 20 + Math.random() * 60;
        const speed = 70 + (level - 1) * 18 + Math.random() * 10;
        const color = balloonColors[Math.floor(Math.random() * balloonColors.length)];

        button.style.left = `${x}px`;
        button.style.top = `${y}px`;
        button.style.width = `${size}px`;
        button.style.height = `${size * 1.25}px`;
        button.innerHTML = `<span class="body"></span><span class="tail"></span><span class="knot"></span>`;

        const body = button.querySelector(".body");
        const tail = button.querySelector(".tail");
        const knot = button.querySelector(".knot");
        if (body) {
          body.style.background = color.body;
          body.style.boxShadow = `inset -8px -8px 0 rgba(255, 255, 255, 0.25), 0 8px 0 ${color.shadow}`;
        }
        if (tail) {
          tail.style.background = color.tail;
        }
        if (knot) {
          knot.style.background = color.tail;
        }

        const popHandler = (event) => {
          event.preventDefault();
          event.stopPropagation();
          popBalloon(button, Boolean(color.ghost));
        };

        button.addEventListener("pointerdown", popHandler, { passive: false });

        balloons.push({ element: button, y, speed, size });
        stage.appendChild(button);
      }

      function removeBalloon(button) {
        balloons = balloons.filter((item) => item.element !== button);
      }

      function showGhostOverlay() {
        ghostOverlay.classList.add("show");
        clearTimeout(ghostOverlay.timeoutId);
        ghostOverlay.timeoutId = setTimeout(() => {
          ghostOverlay.classList.remove("show");
        }, 900);
      }

      function showGameOver() {
        gameOver = true;
        gameoverOverlay.classList.add("show");
        playGameOverMusic().catch(() => {
          console.warn("Game over audio failed to play.");
        });
      }

      function hideGameOver() {
        gameOver = false;
        gameoverOverlay.classList.remove("show");
      }

      function popBalloon(button, isGhost) {
        if (gameOver || button.classList.contains("popped")) return;

        button.classList.add("popped");
        poppedCount += 1;
        counter.textContent = `${poppedCount}/${popGoal}`;

        if (isGhost) {
          ghostPops += 1;
          showGhostOverlay();
          if (ghostPops >= 3) {
            showGameOver();
          }
        }

        burstStars(button);

        if (!gameOver && poppedCount >= popGoal) {
          level += 1;
          poppedCount = 0;
          counter.textContent = `0/${popGoal}`;
          levelDisplay.textContent = `レベル ${level}`;
          showLevelNotice(`レベル ${level}!`);
        }

        setTimeout(() => {
          if (button.parentNode) {
            button.remove();
          }
          removeBalloon(button);
          if (!gameOver) {
            createBalloon();
          }
        }, 180);
      }

      function burstStars(button) {
        const rect = button.getBoundingClientRect();
        const stageRect = stage.getBoundingClientRect();
        const centerX = rect.left - stageRect.left + rect.width / 2;
        const centerY = rect.top - stageRect.top + rect.height / 2;

        for (let i = 0; i < 12; i += 1) {
          const star = document.createElement("span");
          star.className = "star";
          const angle = (i / 12) * Math.PI * 2;
          const distance = 35 + Math.random() * 30;
          star.style.left = `${centerX}px`;
          star.style.top = `${centerY}px`;
          star.style.setProperty("--x", `${Math.cos(angle) * distance}px`);
          star.style.setProperty("--y", `${Math.sin(angle) * distance}px`);
          starsBox.appendChild(star);

          setTimeout(() => star.remove(), 700);
        }
      }

      async function playGameOverMusic() {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;

        if (!audioContext) {
          audioContext = new AudioContext();
        }
        if (audioContext.state === "suspended") {
          try {
            await audioContext.resume();
          } catch (error) {
            return;
          }
        }

        const now = audioContext.currentTime;
        const notes = [220, 196, 174, 164];
        const gain = audioContext.createGain();
        gain.gain.setValueAtTime(0.03, now);
        gain.connect(audioContext.destination);

        notes.forEach((freq, index) => {
          const osc = audioContext.createOscillator();
          osc.type = index % 2 === 0 ? "triangle" : "sine";
          osc.frequency.setValueAtTime(freq, now + index * 0.18);
          osc.connect(gain);
          osc.start(now + index * 0.18);
          osc.stop(now + index * 0.18 + 0.32);
        });

        gain.gain.setValueAtTime(0.03, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.1);
      }

      function animate(time) {
        if (!lastTime) {
          lastTime = time;
        }
        const delta = Math.min((time - lastTime) / 1000, 0.03);
        lastTime = time;

        balloons.forEach((balloon) => {
          balloon.y -= balloon.speed * delta;
          balloon.element.style.top = `${balloon.y}px`;

          if (balloon.y + balloon.size < -40) {
            if (balloon.element.parentNode) {
              balloon.element.remove();
            }
            removeBalloon(balloon.element);
            createBalloon();
          }
        });

        animationFrameId = window.requestAnimationFrame(animate);
      }

      function resetGame() {
        poppedCount = 0;
        ghostPops = 0;
        level = 1;
        gameOver = false;
        counter.textContent = `0/${popGoal}`;
        levelDisplay.textContent = "レベル 1";
        starsBox.innerHTML = "";
        hideGameOver();
        balloons.forEach((balloon) => balloon.element.remove());
        balloons = [];
        if (animationFrameId) {
          window.cancelAnimationFrame(animationFrameId);
        }
        lastTime = 0;
        for (let i = 0; i < 4; i += 1) {
          createBalloon();
        }
        animationFrameId = window.requestAnimationFrame(animate);
      }

      retryButton.addEventListener("click", resetGame);
      resetGame();
    </script>
  </body>
</html>
